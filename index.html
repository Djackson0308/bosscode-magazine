<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BOSS CODE Magazine Library</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0d0d0d;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        .header {
            background: #000;
            border-bottom: 1px solid #333;
            padding: 28px 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 30px;
            letter-spacing: 4px;
        }

        .header p {
            margin: 8px 0 0;
            color: #bbb;
            font-size: 14px;
        }

        .library {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .section-title {
            margin-bottom: 25px;
            font-size: 22px;
            letter-spacing: 2px;
        }

        .issue-grid {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(220px, 280px)
            );
            gap: 30px;
            justify-content: start;
        }

        .issue-card {
            background: #171717;
            border: 1px solid #333;
            border-radius: 10px;
            overflow: hidden;
            transition:
                transform 0.2s ease,
                border-color 0.2s ease;
        }

        .issue-card:hover {
            transform: translateY(-5px);
            border-color: #F5C518;
        }

        .cover-wrap {
            background: #222;
            width: 100%;
            aspect-ratio: 8.5 / 11;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cover-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .loading-cover {
            color: #aaa;
            font-size: 14px;
        }

        .issue-info {
            padding: 18px;
        }

        .issue-title {
            margin: 0 0 6px;
            font-size: 18px;
        }

        .issue-subtitle {
            margin: 0 0 18px;
            font-size: 13px;
            color: #aaa;
        }

        .read-button {
            display: block;
            width: 100%;
            background: #F5C518;
            color: #D71920;
            text-decoration: none;
            text-align: center;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
        }

        .read-button:hover {
            background: #F2A900;
        }

        .footer {
            text-align: center;
            color: #777;
            padding: 30px 20px;
            font-size: 12px;
        }

        @media (max-width: 600px) {

            .header h1 {
                font-size: 22px;
                letter-spacing: 2px;
            }

            .library {
                padding: 25px 15px;
            }

            .issue-grid {
                grid-template-columns: 1fr;
                justify-items: center;
            }

            .issue-card {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>

<body>

    <div class="header">

        <h1>
            BOSS CODE MAGAZINE
        </h1>

        <p>
            Greatness Is A Decision
        </p>

    </div>


    <main class="library">

        <div class="section-title">
            MAGAZINE LIBRARY
        </div>


        <div class="issue-grid">


            <article class="issue-card">

                <div class="cover-wrap">

                    <div
                        class="loading-cover"
                        id="loading-cover-26"
                    >
                        Loading Cover...
                    </div>

                    <canvas
                        class="cover-canvas"
                        id="cover-canvas-26"
                        style="display:none;"
                    ></canvas>

                </div>


                <div class="issue-info">

                    <h2 class="issue-title">
                        BOSS CODE Magazine
                    </h2>

                    <p class="issue-subtitle">
                        Issue 26
                    </p>

                    <a
                        href="reader.html?pdf=CORMEGA%2026.pdf"
                        class="read-button"
                    >
                        READ ISSUE
                    </a>

                </div>

            </article>


        </div>

    </main>


    <div class="footer">
        BOSS CODE MAGAZINE
    </div>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>


    <script>

        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


        const magazines = [

            {
                pdf: "CORMEGA 26.pdf",
                canvasId: "cover-canvas-26",
                loadingId: "loading-cover-26"
            }

        ];


        async function loadMagazineCover(
            pdfFile,
            canvasId,
            loadingId
        ) {

            try {

                const pdf =
                    await pdfjsLib
                        .getDocument(pdfFile)
                        .promise;


                const firstPage =
                    await pdf.getPage(1);


                const viewport =
                    firstPage.getViewport({
                        scale: 1
                    });


                const canvas =
                    document.getElementById(
                        canvasId
                    );


                const context =
                    canvas.getContext("2d");


                canvas.width =
                    viewport.width;

                canvas.height =
                    viewport.height;


                await firstPage.render({
                    canvasContext: context,
                    viewport: viewport
                }).promise;


                document
                    .getElementById(loadingId)
                    .style.display =
                    "none";


                canvas.style.display =
                    "block";

            }

            catch (error) {

                console.error(error);

                document
                    .getElementById(loadingId)
                    .innerText =
                    "Cover unavailable";

            }

        }


        magazines.forEach(
            function (magazine) {

                loadMagazineCover(
                    magazine.pdf,
                    magazine.canvasId,
                    magazine.loadingId
                );

            }
        );

    </script>

</body>
</html>
