<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BOSS CODE Magazine</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }


        /* =========================
           LOADING SCREEN
        ========================= */

        #loading-screen {
            position: fixed;

            inset: 0;

            background: #000;

            display: flex;

            align-items: center;

            justify-content: center;

            z-index: 9999;

            transition:
                opacity 0.5s ease,
                visibility 0.5s ease;
        }

        #loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loading-content {
            width: min(520px, 86vw);

            text-align: center;
        }

        .loading-logo {
            width: min(440px, 82vw);

            height: auto;

            display: block;

            margin: 0 auto 22px;
        }

        .loading-tagline {
            color: white;

            font-size: 18px;

            font-weight: bold;

            letter-spacing: 4px;

            margin-bottom: 28px;
        }

        .loading-bar-shell {
            width: 100%;

            height: 7px;

            background: #222;

            border-radius: 20px;

            overflow: hidden;

            margin-bottom: 14px;
        }

        .loading-bar {
            width: 35%;

            height: 100%;

            background: #F5C518;

            border-radius: 20px;

            animation:
                loadingMove
                1.2s
                ease-in-out
                infinite;
        }

        @keyframes loadingMove {

            0% {
                transform: translateX(-120%);
            }

            50% {
                transform: translateX(150%);
            }

            100% {
                transform: translateX(320%);
            }

        }

        .loading-text {
            color: #aaa;

            font-size: 12px;

            letter-spacing: 3px;
        }


        /* =========================
           TOP BAR
        ========================= */

        .top-bar {
            background: #000;

            border-bottom: 1px solid #333;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 10px 20px;

            gap: 15px;

            flex-wrap: wrap;

            position: relative;

            z-index: 50;
        }

        .logo {
            font-size: 20px;

            font-weight: bold;

            letter-spacing: 3px;

            white-space: nowrap;
        }

        .controls {
            display: flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            flex-wrap: wrap;
        }

        button,
        .top-link {
            background: #222;

            color: white;

            border: 1px solid #555;

            padding: 9px 13px;

            border-radius: 6px;

            cursor: pointer;

            font-size: 14px;

            text-decoration: none;

            display: inline-flex;

            align-items: center;

            justify-content: center;
        }

        button:hover,
        .top-link:hover {
            background: #333;
        }

        button:disabled {
            opacity: 0.4;

            cursor: default;
        }


        /* =========================
           BOSS CODE BUTTONS
        ========================= */

        .magazines-button,
        .pages-button,
        .share-button {
            background: #F5C518;

            color: #000;

            border: 1px solid #F5C518;

            font-weight: bold;
        }

        .magazines-button:hover,
        .pages-button:hover,
        .share-button:hover {
            background: #F2A900;

            color: #000;
        }

        .boss-yellow {
            background: #F5C518;

            color: #D71920;

            border: 1px solid #F5C518;

            font-weight: bold;

            font-size: 20px;

            line-height: 1;

            min-width: 42px;
        }

        .boss-yellow:hover {
            background: #F2A900;

            color: #D71920;
        }

        #page-number,
        #zoom-level {
            min-width: 75px;

            text-align: center;

            font-size: 14px;
        }


        /* =========================
           SHARE MESSAGE
        ========================= */

        #share-message {
            position: fixed;

            left: 50%;

            bottom: 24px;

            transform:
                translateX(-50%);

            background: #F5C518;

            color: #000;

            padding: 10px 18px;

            border-radius: 8px;

            font-weight: bold;

            font-size: 13px;

            opacity: 0;

            pointer-events: none;

            transition: opacity 0.25s ease;

            z-index: 500;
        }

        #share-message.show {
            opacity: 1;
        }


        /* =========================
           MAIN READER
        ========================= */

        .main-area {
            flex: 1;

            min-height: 0;

            display: flex;

            position: relative;

            overflow: hidden;
        }

        .reader-area {
            flex: 1;

            min-width: 0;

            min-height: 0;

            overflow: auto;

            position: relative;

            padding: 20px;

            overscroll-behavior: contain;
        }

        .book-wrapper {
            width: 100%;

            min-height: 100%;

            display: flex;

            justify-content: center;

            align-items: center;

            position: relative;
        }

        #zoom-container {
            transform-origin: center center;

            transition: transform 0.2s ease;

            display: flex;

            justify-content: center;

            align-items: center;
        }

        #book {
            margin: auto;
        }

        .page {
            background: white;

            overflow: hidden;

            box-shadow:
                0 0 8px
                rgba(0, 0, 0, 0.5);
        }

        .page canvas {
            width: 100%;

            height: 100%;

            display: block;
        }


        /* =========================
           THUMBNAILS
        ========================= */

        .thumbnail-panel {
            width: 0;

            background: #0a0a0a;

            border-right: 1px solid #333;

            overflow: hidden;

            transition: width 0.25s ease;

            flex-shrink: 0;

            position: relative;

            z-index: 40;
        }

        .thumbnail-panel.open {
            width: 230px;
        }

        .thumbnail-header {
            height: 50px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 12px;

            border-bottom: 1px solid #333;

            font-weight: bold;

            white-space: nowrap;
        }

        .close-thumbnails {
            background: transparent;

            border: none;

            color: white;

            font-size: 20px;

            padding: 5px 8px;
        }

        .thumbnail-list {
            height: calc(100% - 50px);

            overflow-y: auto;

            padding: 12px;
        }

        .thumbnail-item {
            margin-bottom: 16px;

            cursor: pointer;

            text-align: center;
        }

        .thumbnail-item canvas {
            width: 100%;

            display: block;

            background: white;

            border: 2px solid transparent;

            border-radius: 4px;
        }

        .thumbnail-item:hover canvas,
        .thumbnail-item.active canvas {
            border-color: #F5C518;
        }

        .thumbnail-number {
            margin-top: 5px;

            font-size: 12px;

            color: #ccc;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            .top-bar {
                justify-content: center;

                padding: 8px;

                gap: 6px;
            }

            .logo {
                width: 100%;

                text-align: center;

                font-size: 15px;

                letter-spacing: 2px;
            }

            .controls {
                width: 100%;

                gap: 6px;
            }

            button,
            .top-link {
                padding: 7px 9px;

                font-size: 11px;
            }

            .boss-yellow {
                font-size: 18px;

                min-width: 38px;
            }

            #page-number,
            #zoom-level {
                min-width: 52px;

                font-size: 11px;
            }

            .reader-area {
                padding: 8px;
            }

            .thumbnail-panel {
                position: absolute;

                top: 0;

                left: 0;

                bottom: 0;

                box-shadow:
                    6px 0 18px
                    rgba(0, 0, 0, 0.6);
            }

            .thumbnail-panel.open {
                width: 190px;
            }

            .loading-tagline {
                font-size: 14px;

                letter-spacing: 3px;
            }

        }


        @media (max-width: 480px) {

            .logo {
                font-size: 14px;
            }

            button,
            .top-link {
                padding: 6px 8px;

                font-size: 10px;
            }

            .boss-yellow {
                min-width: 34px;

                font-size: 17px;
            }

            #page-number,
            #zoom-level {
                min-width: 46px;
            }

            .reader-area {
                padding: 4px;
            }

            .loading-tagline {
                font-size: 12px;

                letter-spacing: 2px;
            }

        }

    </style>
</head>


<body>


    <!-- =========================
         LOADING SCREEN
    ========================== -->

    <div id="loading-screen">

        <div class="loading-content">

            <img
                src="boss-code-logo.png"
                alt="BOSS Code Magazine"
                class="loading-logo"
            >

            <div class="loading-tagline">
                GREATNESS IS A DECISION
            </div>

            <div class="loading-bar-shell">

                <div class="loading-bar"></div>

            </div>

            <div
                class="loading-text"
                id="loading-text"
            >
                LOADING MAGAZINE...
            </div>

        </div>

    </div>


    <!-- =========================
         SHARE CONFIRMATION
    ========================== -->

    <div id="share-message">
        Magazine link copied!
    </div>


    <!-- =========================
         TOP BAR
    ========================== -->

    <div class="top-bar">

        <div class="logo">
            BOSS CODE MAGAZINE
        </div>


        <div class="controls">

            <a
                href="index.html"
                class="top-link magazines-button"
            >
                MAGAZINES
            </a>


            <button
                id="pages"
                class="pages-button"
            >
                PAGES
            </button>


            <button
                id="share"
                class="share-button"
            >
                SHARE
            </button>


            <button
                id="prev"
                title="Previous Page"
            >
                ◀
            </button>


            <span id="page-number">
                Loading...
            </span>


            <button
                id="next"
                title="Next Page"
            >
                ▶
            </button>


            <button
                id="zoom-out"
                class="boss-yellow"
                title="Zoom Out"
            >
                −
            </button>


            <span id="zoom-level">
                100%
            </span>


            <button
                id="zoom-in"
                class="boss-yellow"
                title="Zoom In"
            >
                +
            </button>


            <button id="reset-zoom">
                Reset
            </button>


            <button id="fullscreen">
                Fullscreen
            </button>

        </div>

    </div>


    <!-- =========================
         MAIN AREA
    ========================== -->

    <div class="main-area">


        <div
            class="thumbnail-panel"
            id="thumbnail-panel"
        >

            <div class="thumbnail-header">

                <span>
                    PAGES
                </span>


                <button
                    id="close-thumbnails"
                    class="close-thumbnails"
                >
                    ×
                </button>

            </div>


            <div
                class="thumbnail-list"
                id="thumbnail-list"
            ></div>

        </div>


        <div
            class="reader-area"
            id="reader-area"
        >

            <div class="book-wrapper">

                <div id="zoom-container">

                    <div id="book"></div>

                </div>

            </div>

        </div>


    </div>


    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"
    ></script>


    <script
        src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"
    ></script>


    <script>

        const params =
            new URLSearchParams(
                window.location.search
            );


        const pdfFile =
            params.get("pdf") ||
            "CORMEGA 26.pdf";


        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


        let pageFlip = null;

        let zoom = 1;


        const minimumZoom = 0.6;

        const maximumZoom = 2.5;

        const zoomStep = 0.2;


        function isMobileView() {

            return window.innerWidth <= 800;

        }


        const startedInMobileMode =
            isMobileView();



        /* =========================
           LOADING SCREEN
        ========================= */


        function updateLoadingText(text) {

            document
                .getElementById(
                    "loading-text"
                )
                .innerText =
                text;

        }


        function hideLoadingScreen() {

            const loadingScreen =
                document.getElementById(
                    "loading-screen"
                );


            loadingScreen.classList.add(
                "hidden"
            );


            setTimeout(
                function () {

                    loadingScreen.style.display =
                        "none";

                },
                550
            );

        }



        /* =========================
           SHARE
        ========================= */


        function showShareMessage(
            message
        ) {

            const shareMessage =
                document.getElementById(
                    "share-message"
                );


            shareMessage.innerText =
                message;


            shareMessage.classList.add(
                "show"
            );


            setTimeout(
                function () {

                    shareMessage.classList.remove(
                        "show"
                    );

                },
                2000
            );

        }


        async function shareMagazine() {

            const shareData = {

                title:
                    "BOSS CODE Magazine",

                text:
                    "Check out BOSS CODE Magazine.",

                url:
                    window.location.href

            };


            try {


                if (
                    navigator.share
                ) {


                    await navigator.share(
                        shareData
                    );


                } else {


                    await navigator.clipboard.writeText(
                        window.location.href
                    );


                    showShareMessage(
                        "Magazine link copied!"
                    );

                }


            } catch (error) {


                if (
                    error.name !==
                    "AbortError"
                ) {


                    try {


                        await navigator.clipboard.writeText(
                            window.location.href
                        );


                        showShareMessage(
                            "Magazine link copied!"
                        );


                    } catch (
                        clipboardError
                    ) {


                        showShareMessage(
                            "Unable to copy link."
                        );

                    }

                }

            }

        }



        /* =========================
           ZOOM
        ========================= */


        function updateZoom() {


            const zoomContainer =
                document.getElementById(
                    "zoom-container"
                );


            const zoomLevel =
                document.getElementById(
                    "zoom-level"
                );


            zoomContainer.style.transform =
                `scale(${zoom})`;


            zoomLevel.innerText =
                Math.round(
                    zoom * 100
                ) +
                "%";


            document
                .getElementById(
                    "zoom-out"
                )
                .disabled =
                zoom <= minimumZoom;


            document
                .getElementById(
                    "zoom-in"
                )
                .disabled =
                zoom >= maximumZoom;

        }



        /* =========================
           ACTIVE THUMBNAIL
        ========================= */


        function updateActiveThumbnail(
            pageIndex
        ) {


            const thumbnails =
                document.querySelectorAll(
                    ".thumbnail-item"
                );


            thumbnails.forEach(
                function (thumbnail) {

                    thumbnail.classList.remove(
                        "active"
                    );

                }
            );


            const activeThumbnail =
                document.querySelector(
                    `[data-page-index="${pageIndex}"]`
                );


            if (
                activeThumbnail
            ) {


                activeThumbnail.classList.add(
                    "active"
                );


                activeThumbnail.scrollIntoView({
                    behavior: "smooth",
                    block: "nearest"
                });

            }

        }



        /* =========================
           THUMBNAILS
        ========================= */


        async function createThumbnail(
            pdfPage,
            pageIndex
        ) {


            const thumbnailList =
                document.getElementById(
                    "thumbnail-list"
                );


            const thumbnailItem =
                document.createElement(
                    "div"
                );


            thumbnailItem.className =
                "thumbnail-item";


            thumbnailItem.setAttribute(
                "data-page-index",
                pageIndex
            );


            const canvas =
                document.createElement(
                    "canvas"
                );


            const context =
                canvas.getContext(
                    "2d"
                );


            const viewport =
                pdfPage.getViewport({
                    scale: 0.35
                });


            canvas.width =
                viewport.width;


            canvas.height =
                viewport.height;


            const label =
                document.createElement(
                    "div"
                );


            label.className =
                "thumbnail-number";


            label.innerText =
                "Page " +
                (pageIndex + 1);


            thumbnailItem.appendChild(
                canvas
            );


            thumbnailItem.appendChild(
                label
            );


            thumbnailList.appendChild(
                thumbnailItem
            );


            await pdfPage.render({

                canvasContext:
                    context,

                viewport:
                    viewport

            }).promise;


            thumbnailItem.addEventListener(

                "click",

                function () {


                    if (
                        pageFlip
                    ) {


                        pageFlip.flip(
                            pageIndex
                        );

                    }


                    if (
                        isMobileView()
                    ) {


                        document
                            .getElementById(
                                "thumbnail-panel"
                            )
                            .classList
                            .remove(
                                "open"
                            );

                    }

                }

            );

        }



        /* =========================
           BUILD MAGAZINE
        ========================= */


        async function buildMagazine() {


            const book =
                document.getElementById(
                    "book"
                );


            try {


                updateLoadingText(
                    "LOADING MAGAZINE..."
                );


                const pdf =
                    await pdfjsLib
                        .getDocument(
                            pdfFile
                        )
                        .promise;


                updateLoadingText(
                    "BUILDING PAGES..."
                );



                for (

                    let pageNumber = 1;

                    pageNumber <=
                    pdf.numPages;

                    pageNumber++

                ) {


                    const pdfPage =
                        await pdf.getPage(
                            pageNumber
                        );


                    const viewport =
                        pdfPage.getViewport({
                            scale: 1.5
                        });


                    const pageElement =
                        document.createElement(
                            "div"
                        );


                    pageElement.className =
                        "page";


                    if (

                        pageNumber === 1 ||

                        pageNumber ===
                        pdf.numPages

                    ) {


                        pageElement.setAttribute(

                            "data-density",

                            "hard"

                        );

                    }


                    const canvas =
                        document.createElement(
                            "canvas"
                        );


                    const context =
                        canvas.getContext(
                            "2d"
                        );


                    canvas.width =
                        viewport.width;


                    canvas.height =
                        viewport.height;


                    pageElement.appendChild(
                        canvas
                    );


                    book.appendChild(
                        pageElement
                    );


                    await pdfPage.render({

                        canvasContext:
                            context,

                        viewport:
                            viewport

                    }).promise;


                    await createThumbnail(

                        pdfPage,

                        pageNumber - 1

                    );


                    const percent =
                        Math.round(

                            (
                                pageNumber /
                                pdf.numPages
                            )
                            *
                            100

                        );


                    updateLoadingText(

                        "BUILDING MAGAZINE " +
                        percent +
                        "%"

                    );

                }



                const mobile =
                    isMobileView();


                const mobileWidth =
                    Math.max(

                        250,

                        Math.min(
                            window.innerWidth - 24,
                            550
                        )

                    );


                const mobileHeight =
                    Math.round(
                        mobileWidth *
                        1.294
                    );



                pageFlip =
                    new St.PageFlip(

                        document.getElementById(
                            "book"
                        ),

                        {


                            width:
                                mobile
                                ?
                                mobileWidth
                                :
                                550,


                            height:
                                mobile
                                ?
                                mobileHeight
                                :
                                712,


                            size:
                                "stretch",


                            minWidth:
                                mobile
                                ?
                                250
                                :
                                280,


                            maxWidth:
                                mobile
                                ?
                                550
                                :
                                700,


                            minHeight:
                                mobile
                                ?
                                324
                                :
                                362,


                            maxHeight:
                                mobile
                                ?
                                712
                                :
                                906,


                            maxShadowOpacity:
                                0.5,


                            showCover:
                                true,


                            usePortrait:
                                mobile,


                            mobileScrollSupport:
                                false,


                            flippingTime:
                                800,


                            drawShadow:
                                true,


                            startZIndex:
                                0,


                            autoSize:
                                true

                        }

                    );



                pageFlip.loadFromHTML(

                    document.querySelectorAll(
                        ".page"
                    )

                );



                const pageDisplay =
                    document.getElementById(
                        "page-number"
                    );


                function updatePageDisplay() {


                    const current =
                        pageFlip
                            .getCurrentPageIndex()
                        +
                        1;


                    const total =
                        pageFlip
                            .getPageCount();


                    if (

                        !mobile &&

                        current > 1 &&

                        current < total

                    ) {


                        const rightPage =
                            Math.min(

                                current + 1,

                                total

                            );


                        pageDisplay.innerText =

                            current +

                            " - " +

                            rightPage +

                            " / " +

                            total;


                    } else {


                        pageDisplay.innerText =

                            current +

                            " / " +

                            total;

                    }


                    updateActiveThumbnail(

                        current - 1

                    );

                }



                updatePageDisplay();



                pageFlip.on(

                    "flip",

                    updatePageDisplay

                );



                document
                    .getElementById(
                        "prev"
                    )
                    .addEventListener(

                        "click",

                        function () {

                            pageFlip.flipPrev();

                        }

                    );


                document
                    .getElementById(
                        "next"
                    )
                    .addEventListener(

                        "click",

                        function () {

                            pageFlip.flipNext();

                        }

                    );



                document
                    .getElementById(
                        "zoom-in"
                    )
                    .addEventListener(

                        "click",

                        function () {


                            zoom =
                                Math.min(

                                    zoom +
                                    zoomStep,

                                    maximumZoom

                                );


                            updateZoom();

                        }

                    );


                document
                    .getElementById(
                        "zoom-out"
                    )
                    .addEventListener(

                        "click",

                        function () {


                            zoom =
                                Math.max(

                                    zoom -
                                    zoomStep,

                                    minimumZoom

                                );


                            updateZoom();

                        }

                    );



                document
                    .getElementById(
                        "reset-zoom"
                    )
                    .addEventListener(

                        "click",

                        function () {


                            zoom = 1;


                            updateZoom();


                            document
                                .getElementById(
                                    "reader-area"
                                )
                                .scrollTo({

                                    top: 0,

                                    left: 0,

                                    behavior:
                                        "smooth"

                                });

                        }

                    );



                document
                    .getElementById(
                        "fullscreen"
                    )
                    .addEventListener(

                        "click",

                        function () {


                            if (
                                !document
                                    .fullscreenElement
                            ) {


                                document
                                    .documentElement
                                    .requestFullscreen();


                            } else {


                                document
                                    .exitFullscreen();

                            }

                        }

                    );



                document
                    .getElementById(
                        "pages"
                    )
                    .addEventListener(

                        "click",

                        function () {


                            document
                                .getElementById(
                                    "thumbnail-panel"
                                )
                                .classList
                                .toggle(
                                    "open"
                                );

                        }

                    );



                document
                    .getElementById(
                        "close-thumbnails"
                    )
                    .addEventListener(

                        "click",

                        function () {


                            document
                                .getElementById(
                                    "thumbnail-panel"
                                )
                                .classList
                                .remove(
                                    "open"
                                );

                        }

                    );



                document
                    .getElementById(
                        "share"
                    )
                    .addEventListener(

                        "click",

                        shareMagazine

                    );



                document.addEventListener(

                    "keydown",

                    function (event) {


                        if (
                            event.key ===
                            "ArrowRight"
                        ) {


                            pageFlip.flipNext();

                        }


                        if (
                            event.key ===
                            "ArrowLeft"
                        ) {


                            pageFlip.flipPrev();

                        }

                    }

                );



                let touchStartX =
                    null;


                let touchStartY =
                    null;


                const readerArea =
                    document.getElementById(
                        "reader-area"
                    );


                readerArea.addEventListener(

                    "touchstart",

                    function (event) {


                        if (

                            zoom > 1 ||

                            event.touches.length
                            !==
                            1

                        ) {


                            return;

                        }


                        touchStartX =
                            event
                                .touches[0]
                                .clientX;


                        touchStartY =
                            event
                                .touches[0]
                                .clientY;

                    },

                    {
                        passive: true
                    }

                );



                readerArea.addEventListener(

                    "touchend",

                    function (event) {


                        if (

                            zoom > 1 ||

                            touchStartX ===
                            null

                        ) {


                            return;

                        }


                        const endX =
                            event
                                .changedTouches[0]
                                .clientX;


                        const endY =
                            event
                                .changedTouches[0]
                                .clientY;


                        const differenceX =
                            endX -
                            touchStartX;


                        const differenceY =
                            endY -
                            touchStartY;


                        if (

                            Math.abs(
                                differenceX
                            ) > 50

                            &&

                            Math.abs(
                                differenceX
                            ) >

                            Math.abs(
                                differenceY
                            )

                        ) {


                            if (
                                differenceX < 0
                            ) {


                                pageFlip.flipNext();


                            } else {


                                pageFlip.flipPrev();

                            }

                        }


                        touchStartX =
                            null;


                        touchStartY =
                            null;

                    },

                    {
                        passive: true
                    }

                );



                updateZoom();


                updateLoadingText(
                    "READY"
                );


                setTimeout(

                    hideLoadingScreen,

                    350

                );


            } catch (error) {


                console.error(
                    error
                );


                updateLoadingText(
                    "MAGAZINE COULD NOT LOAD"
                );

            }

        }



        window.addEventListener(

            "resize",

            function () {


                const nowMobile =
                    isMobileView();


                if (
                    nowMobile !==
                    startedInMobileMode
                ) {


                    window.location.reload();

                }

            }

        );



        buildMagazine();


    </script>
